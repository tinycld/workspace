# node-linker=hoisted reproduces npm's flat node_modules: dependencies are
# hoisted to the workspace-root (and app) node_modules rather than isolated in
# the .pnpm virtual store with per-package symlinks. This matches what npm did
# and keeps Metro's resolver — which expects a flat-ish tree and doesn't
# traverse pnpm's nested .pnpm symlink graph well — working without custom
# resolver hacks. (pnpm 10+ reads this from pnpm-workspace.yaml, NOT .npmrc.)
nodeLinker: hoisted

# Link matching workspace members even for plain "*" specs (members declare
# @tinycld/core and @tinycld/package-scripts as "*", not workspace:*).
linkWorkspacePackages: true

# Tolerate peer-dependency version drift across the heavy RN/Expo dep graph
# (pnpm's equivalent of npm's legacy-peer-deps): mismatches warn, not error.
strictPeerDependencies: false

# Run the workspace-root postinstall (link-members + the generator).
enablePrePostScripts: true

packages:
  - tinycld
  - tinycld/core
  - tinycld/package-scripts
  - contacts
  - mail
  - drive
  - text
  - calc
  - calendar
  - cards
  - google-takeout-import
  - search-alpha
  - search-beta

# Per-package build-script approvals. pnpm blocks dependency install/postinstall
# scripts by default; these are trusted and needed: esbuild (its native binary,
# used by the text webview-editor bundler) and @sentry/cli.
allowBuilds:
  esbuild: true
  '@sentry/cli': true

# pnpm 11.3 ships a default minimumReleaseAge supply-chain gate (~24h) that
# rejects very freshly-published versions. We don't use it — disable it so a
# same-day publish (e.g. a pbtsdb hotfix we just cut) installs immediately.
# This file is per-developer local state (not committed to a member repo).
minimumReleaseAge: 0

# Framework/native/styling version pins — source of truth is package-versions.json
# (and FRAMEWORK_OVERRIDES in @tinycld/bootstrap, which generates both). They keep
# the in-app OTA rebuild's `pnpm install --no-frozen-lockfile` from drifting these
# deps off the device's embedded native binary (a native-module mismatch breaks
# the OTA bundle; a uniwind/tailwindcss bump recompiles classNames differently →
# app-wide visual drift). Edit package-versions.json, not this block; re-run
# bootstrap or pnpm install to regenerate. Bump in lockstep with each EAS build.
overrides:
  '@gluestack-ui/utils': 5.0.5-alpha.0
  '@sentry/react-native': 7.11.0
  '@shopify/flash-list': 2.0.2
  '@tanstack/db': 0.8.5
  '@tanstack/react-db': 0.3.5
  '@tanstack/react-query': 5.101.0
  expo: 55.0.26
  expo-image: 55.0.11
  expo-image-picker: 55.0.20
  expo-router: 55.0.16
  lucide-react-native: 1.17.0
  react: 19.2.0
  react-dom: 19.2.0
  react-hook-form: 7.77.0
  react-native: 0.83.6
  react-native-drax: github:nathanstitt/react-native-drax#eccc8b6f7f453882dc38182f59b76c46587b67ff
  react-native-gesture-handler: 3.0.1
  react-native-reanimated: 4.2.1
  react-native-safe-area-context: 5.6.2
  react-native-screens: 4.23.0
  react-native-svg: 15.15.3
  react-native-web: 0.21.2
  react-native-worklets: 0.7.4
  tailwind-merge: 3.6.0
  tailwind-variants: 0.1.20
  tailwindcss: 4.3.0
  uniwind: 1.8.0
