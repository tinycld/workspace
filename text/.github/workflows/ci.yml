name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_REPO: tinycld/tinycld
  APP_REF: main
  # @tinycld/text imports from @tinycld/drive (document storage as drive
  # items, image upload, copy-to-folder dialog, etc). Drive must be linked
  # in the app shell or typecheck and Playwright both fail.
  DRIVE_REPO: tinycld/drive
  DRIVE_REF: main

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: text
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: tinycld
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.DRIVE_REPO }}
          ref: ${{ env.DRIVE_REF }}
          path: drive
      - uses: actions/setup-node@v5
        with:
          node-version-file: tinycld/.node-version
          cache: npm
          cache-dependency-path: tinycld/package-lock.json

      - name: Install tinycld deps (biome lives here)
        working-directory: tinycld
        run: npm ci

      - name: Link drive into tinycld app shell
        working-directory: tinycld
        run: npm run packages:link ../drive

      - name: Link text into tinycld app shell
        working-directory: tinycld
        run: npm run packages:link ../text

      - name: Lint (biome runs from tinycld; scans linked text via app rules)
        working-directory: tinycld
        run: npm run lint

      # Typecheck runs from inside tinycld so module resolution sees the
      # full app-shell tree (uniwind augments, expo types, etc).
      - name: Typecheck (full app shell, package included via link)
        working-directory: tinycld
        env:
          NODE_OPTIONS: --preserve-symlinks
        run: npm run typecheck

      - name: Run unit tests (vitest picks up text via packages glob)
        working-directory: tinycld
        run: npx vitest run packages/@tinycld/text

  go-tests:
    name: Go server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: text
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: tinycld
      - uses: actions/setup-node@v5
        with:
          node-version-file: tinycld/.node-version
          cache: npm
          cache-dependency-path: tinycld/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: tinycld/server/go.mod
          cache-dependency-path: tinycld/server/go.sum

      # text/server/go.mod no longer carries a `replace tinycld.org/core`
      # directive (it conflicted with the app server's own core replace in
      # the Docker deploy). Core is wired through the generated go.work
      # workspace instead, exactly like the local dev layout and mail/drive.
      # The link step runs the generator, which writes tinycld/server/go.work
      # with `use (. <core> ../../text/server)` — so we must run `go test`
      # from tinycld/server (where go.work lives), targeting the text module,
      # not standalone from text/server (which can't resolve core).
      - name: Install tinycld deps
        working-directory: tinycld
        run: npm ci

      - name: Link text into tinycld app shell (generates server/go.work)
        working-directory: tinycld
        run: npm run packages:link ../text

      # no_ui build tag: PB v0.37+ panics on duplicate route registration
      # when an OnServe handler binds a fixed pattern across the multiple
      # test scenarios that share an app, so the admin UI routes are skipped
      # in tests (the shipped binary still builds without the tag).
      - name: Run Go server tests
        working-directory: tinycld/server
        run: go test -tags no_ui tinycld.org/packages/text/...

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          path: text
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: tinycld
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.DRIVE_REPO }}
          ref: ${{ env.DRIVE_REF }}
          path: drive
      - uses: actions/setup-node@v5
        with:
          node-version-file: tinycld/.node-version
          cache: npm
          cache-dependency-path: tinycld/package-lock.json
      # Playwright owns its own dev-server lifecycle via playwright.config.ts
      # `webServer` (which chains reset-dev-db.ts + dev.ts and spawns
      # PocketBase). The dev script invokes the bundled Go binaries, so we
      # need Go available even though Playwright itself is JS.
      - uses: actions/setup-go@v6
        with:
          go-version-file: tinycld/server/go.mod
          cache-dependency-path: tinycld/server/go.sum

      - name: Install tinycld deps
        working-directory: tinycld
        run: npm ci

      - name: Link drive into tinycld app shell
        working-directory: tinycld
        run: npm run packages:link ../drive

      # Expects tinycld/packages/@tinycld/text to be a symlink to ../text
      # after this step, matching the layout that
      # playwright.config.ts::siblingProjects() walks.
      - name: Link text into tinycld app shell
        working-directory: tinycld
        run: npm run packages:link ../text

      - name: Build PocketBase binary
        working-directory: tinycld/server
        run: go build -o tinycld .

      - name: Reset test DB
        working-directory: tinycld
        run: npx tsx scripts/reset-dev-db.ts --url http://127.0.0.1:7091 --data-dir server/pb_test_data

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tinycld/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        working-directory: tinycld
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system deps
        working-directory: tinycld
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run Playwright (text project only)
        working-directory: tinycld
        env:
          CI: true
          NODE_OPTIONS: --preserve-symlinks
        # 45s per-test timeout (was 90s). The suite runs serially in CI
        # (playwright.config.ts sets workers:1 against the single shared
        # PocketBase) with retries:2, so the per-test timeout is the
        # dominant cost when a test hangs. A genuinely-passing text test
        # finishes in single-digit seconds; 45s is generous headroom for
        # the slowest (docx upload + Yjs round-trip) without letting a
        # broken selector burn 90s × 3 retries and blow the 25-min job cap.
        run: npx playwright test --project "@tinycld/text" --timeout=45000

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tinycld/playwright-report/
          retention-days: 14
